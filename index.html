<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oh/</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  cursor: none;
}

body { background: #1a0535; }

/* =====================
   CURSOR
===================== */
#cursor {
  position: fixed;
  width: 8px; height: 8px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: width 0.2s, height 0.2s;
  mix-blend-mode: difference;
}
#cursor.big { width: 26px; height: 26px; }

/* =====================
   HERO
===================== */
#hero {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* =====================
   BACKGROUND — slow glowing orbs
   Hex palette: 260970, EF59D4, F61905, FFA70A, 00FFFF
===================== */
.bg { position: absolute; inset: -10%; z-index: 0; }

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  mix-blend-mode: screen;
  will-change: transform;
}

.orb1 {
  width: 90vw; height: 90vw;
  background: radial-gradient(circle, #6a0dad 0%, transparent 70%);
  top: -20%; left: -20%; opacity: 0.9;
  animation: o1 24s ease-in-out infinite;
}
.orb2 {
  width: 80vw; height: 80vw;
  background: radial-gradient(circle, #EF59D4 0%, transparent 65%);
  top: 10%; right: -30%; opacity: 0.7;
  animation: o2 30s ease-in-out infinite;
}
.orb3 {
  width: 70vw; height: 70vw;
  background: radial-gradient(circle, #F61905 0%, transparent 65%);
  bottom: -20%; left: 10%; opacity: 0.55;
  animation: o3 22s ease-in-out infinite;
}
.orb4 {
  width: 60vw; height: 60vw;
  background: radial-gradient(circle, #FFA70A 0%, transparent 65%);
  bottom: 0%; right: -10%; opacity: 0.5;
  animation: o4 27s ease-in-out infinite;
}
.orb5 {
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, #260970 0%, transparent 70%);
  top: 30%; left: 30%; opacity: 0.8;
  animation: o5 34s ease-in-out infinite;
}
.orb6 {
  width: 55vw; height: 55vw;
  background: radial-gradient(circle, #00FFFF 0%, transparent 65%);
  bottom: 20%; left: -15%; opacity: 0.22;
  animation: o6 29s ease-in-out infinite;
}

@keyframes o1 {
  0%,100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(8vw,5vh) scale(1.1); }
  66%      { transform: translate(-5vw,10vh) scale(0.95); }
}
@keyframes o2 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%      { transform: translate(-10vw,8vh) scale(1.15); }
  70%      { transform: translate(5vw,-5vh) scale(0.9); }
}
@keyframes o3 {
  0%,100% { transform: translate(0,0) scale(1); }
  50%      { transform: translate(12vw,-8vh) scale(1.2); }
}
@keyframes o4 {
  0%,100% { transform: translate(0,0) scale(1); }
  35%      { transform: translate(-8vw,-6vh) scale(1.1); }
  70%      { transform: translate(6vw,4vh) scale(0.92); }
}
@keyframes o5 {
  0%,100% { transform: translate(0,0) scale(1); opacity:0.8; }
  50%      { transform: translate(-6vw,-8vh) scale(1.3); opacity:0.5; }
}
@keyframes o6 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%      { transform: translate(10vw,-6vh) scale(1.2); }
  75%      { transform: translate(-4vw,8vh) scale(0.85); }
}

/* =====================
   GRAIN — subtle canvas texture
===================== */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9998;
  opacity: 0.45;
}

/* =====================
   LOGO
===================== */
.logo-wrap {
  position: relative;
  z-index: 20;
  background: transparent;
  filter: drop-shadow(0 0 30px rgba(255,255,255,0.25));
}
#logo-canvas { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =====================
   TOP RIGHT — optic/haptic + email
===================== */
.top-right {
  position: absolute;
  top: 5vh; right: 4.5vw;
  z-index: 20;
  text-align: right;
  line-height: 1.4;
  opacity: 0;
  animation: fadeUp 1.2s ease forwards 1s;
  font-weight: 300;
}
.top-right .brand {
  font-size: clamp(0.6rem, 1vw, 0.75rem);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  display: block;
  margin-bottom: 0;
}
.top-right a {
  font-size: clamp(0.7rem, 1.2vw, 0.85rem);
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  padding-bottom: 1px;
  transition: border-color 0.3s;
}
.top-right a:hover { border-color: rgba(255,255,255,0.9); }

/* =====================
   BOTTOM LEFT — location
===================== */
.bottom-left {
  position: absolute;
  bottom: 5.5vh; left: 4.5vw;
  z-index: 20;
  color: rgba(255,255,255,0.85);
  line-height: 2;
  opacity: 0;
  animation: fadeUp 1.2s ease forwards 1s;
  font-weight: 300;
}
.bottom-left p {
  font-size: clamp(0.7rem, 1.2vw, 0.85rem);
  letter-spacing: 0.05em;
}

/* =====================
   MOBILE
===================== */
@media (max-width: 600px) {
  .top-right  { top: 4vh; right: 5vw; }
  .bottom-left { bottom: 4vh; left: 5vw; }
}

/* =====================
   SCROLL INDICATOR — arrow
===================== */
.scroll-ind {
  position: absolute;
  bottom: 4vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 2.2s;
  cursor: pointer;
}
.scroll-ind span {
  font-size: 0.55rem;
  font-weight: 300;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.scroll-arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  animation: arrowBounce 2s ease-in-out infinite;
}
.scroll-arrow svg {
  display: block;
  opacity: 0.7;
}
@keyframes arrowBounce {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(5px); }
}
</style>
</head>
<body>

<div id="cursor"></div>

<section id="hero">

  <!-- BACKGROUND -->
  <div class="bg">
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="bg-orb orb4"></div>
    <div class="bg-orb orb5"></div>
    <div class="bg-orb orb6"></div>
  </div>

  <!-- LOGO -->
  <div class="logo-wrap">
    <canvas id="logo-canvas"></canvas>
  </div>

  <!-- TOP RIGHT — optic/haptic + email -->
  <div class="top-right">
    <span class="brand">optic/haptic</span>
    <a href="mailto:what@o-h.now">what@o-h.now</a>
  </div>

  <!-- BOTTOM LEFT — tagline + location -->
  <div class="bottom-left">
    <p>worlds you can touch</p>
    <p>london, uk</p>
  </div>

  <!-- SCROLL ARROW — hidden for now -->
  <div class="scroll-ind" style="display:none;">
    <span>scroll</span>
    <div class="scroll-arrow">
      <svg width="14" height="8" viewBox="0 0 14 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L7 7L13 1" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</section>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
// CURSOR
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});
document.querySelectorAll('a, .scroll-ind').forEach(el => {
  el.addEventListener('mouseenter', () => cur.classList.add('big'));
  el.addEventListener('mouseleave', () => cur.classList.remove('big'));
});

// LOGO CANVAS ANIMATION
// DPR-aware for crisp rendering on retina displays.
// Slash always visible. Sweeps right revealing oh, holds, sweeps left wiping oh. Perfect loop.
(function() {
  const canvas = document.getElementById('logo-canvas');
  const ctx    = canvas.getContext('2d');

  const DPR   = window.devicePixelRatio || 1;
  const BASE  = 113.39;
  const SCALE = window.innerWidth < 600 ? 2.2 : window.innerWidth < 1200 ? 3.2 : 4.0;
  // W/H are logical (CSS) pixel dimensions
  const W = BASE * SCALE;
  const H = BASE * SCALE;

  // Canvas physical pixels = logical * DPR; CSS size stays logical
  canvas.width        = Math.round(W * DPR);
  canvas.height       = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  // All drawing happens in logical pixels — ctx scaled up by DPR once
  ctx.scale(DPR, DPR);

  // Offscreen canvases at same physical resolution
  function makeOffscreen() {
    const c = document.createElement('canvas');
    c.width  = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    const x  = c.getContext('2d');
    x.scale(DPR, DPR);
    return { c, x };
  }

  const { c: offOH,    x: ctxOH    } = makeOffscreen();
  const { c: offSlash, x: ctxSlash } = makeOffscreen();

  const pathO = new Path2D('M27.98,70.66c-3.18,0-5.98-.56-8.38-1.69-2.4-1.13-4.28-2.7-5.63-4.73-1.35-2.03-2.03-4.38-2.03-7.05s.67-5.07,2.03-7.09c1.35-2.03,3.23-3.6,5.63-4.73,2.4-1.13,5.19-1.69,8.38-1.69s5.97.56,8.38,1.69c2.4,1.13,4.27,2.7,5.61,4.73,1.34,2.03,2,4.39,2,7.09s-.67,5.02-2,7.05c-1.34,2.03-3.2,3.6-5.61,4.73-2.4,1.13-5.19,1.69-8.38,1.69ZM27.98,64.94c1.74,0,3.23-.32,4.48-.95,1.25-.63,2.21-1.52,2.88-2.68.68-1.16,1.01-2.53,1.01-4.12s-.34-3.01-1.01-4.17c-.67-1.16-1.64-2.05-2.88-2.68-1.25-.63-2.74-.95-4.48-.95s-3.2.32-4.46.95c-1.26.63-2.23,1.52-2.91,2.68-.67,1.16-1.01,2.54-1.01,4.17s.34,2.97,1.01,4.12c.68,1.16,1.64,2.05,2.91,2.68,1.26.63,2.75.95,4.46.95Z');
  const pathH = new Path2D('M74.63,48.94c-.9-1.8-2.21-3.19-3.92-4.17-1.71-.97-3.78-1.46-6.21-1.46-2.1,0-4.02.5-5.76,1.49-1.6.91-2.93,2.21-4.01,3.85v-13.71h-7.52v34.68h7.52v-12.38c0-1.59.29-2.96.88-4.1.59-1.14,1.43-2.03,2.52-2.68,1.1-.64,2.38-.97,3.85-.97,2.1,0,3.71.59,4.82,1.78,1.11,1.19,1.67,2.93,1.67,5.25v13.1h7.52v-14.23c0-2.49-.45-4.64-1.35-6.44Z');
  const pathSlash = new Path2D('M94.08,33.4h7.36l-12.61,36.21h-7.36l12.61-36.21Z');

  // Render oh glyphs to offscreen at logical scale
  ctxOH.save();
  ctxOH.scale(SCALE, SCALE);
  ctxOH.fillStyle = '#ffffff';
  ctxOH.fill(pathO);
  ctxOH.fill(pathH);
  ctxOH.restore();

  // Render slash to offscreen at logical scale
  ctxSlash.save();
  ctxSlash.scale(SCALE, SCALE);
  ctxSlash.fillStyle = '#ffffff';
  ctxSlash.fill(pathSlash);
  ctxSlash.restore();

  // Slash glyph left edge in logical pixels
  const SLASH_LEFT_PX = 79.47 * SCALE;
  const FAR_LEFT      = -SLASH_LEFT_PX;

  const TOTAL = 5000;
  const T1 = 0.20, T2 = 0.58, T3 = 0.78;

  function ease(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2;
  }

  let start = null;

  function render(now) {
    if (!start) start = now;
    const p = ((now - start) % TOTAL) / TOTAL;

    ctx.clearRect(0, 0, W, H);

    let slashX, ohClip;

    if (p < T1) {
      const t = ease(p / T1);
      slashX  = FAR_LEFT * (1 - t);
      ohClip  = Math.max(0, SLASH_LEFT_PX + slashX);
    } else if (p < T2) {
      slashX  = 0;
      ohClip  = W;
    } else if (p < T3) {
      const t = ease((p - T2) / (T3 - T2));
      slashX  = FAR_LEFT * t;
      ohClip  = Math.max(0, SLASH_LEFT_PX + slashX);
    } else {
      slashX  = FAR_LEFT;
      ohClip  = 0;
    }

    // Draw oh — clipped to revealed region (logical coords, ctx already DPR-scaled)
    if (ohClip > 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, ohClip, H);
      ctx.clip();
      ctx.drawImage(offOH, 0, 0, W, H);
      ctx.restore();
    }

    // Draw slash — always visible
    ctx.save();
    ctx.translate(slashX, 0);
    ctx.drawImage(offSlash, 0, 0, W, H);
    ctx.restore();
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
