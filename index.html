<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>oh/</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  cursor: none;
}

body { background: #1a0535; }

/* =====================
   CURSOR
===================== */
#cursor {
  position: fixed;
  width: 8px; height: 8px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%,-50%);
  transition: width 0.2s, height 0.2s;
  mix-blend-mode: difference;
}
#cursor.big { width: 26px; height: 26px; }

/* =====================
   HERO
===================== */
#hero {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Isolate hero compositing so orbs don't bleed into the rest of the page */
  isolation: isolate;
}

/* =====================
   BACKGROUND ORBS
   Performance notes:
   - NO mix-blend-mode on individual orbs (expensive per-layer compositing)
   - blur applied once via filter on the .bg container, not per-orb
   - will-change: transform promotes each orb to its own GPU layer
   - opacity changes only (no color/filter changes during animation)
   - scale() only — no translate on mobile to reduce repaints
===================== */
.bg {
  position: absolute;
  inset: -15%;
  z-index: 0;
  /* Single blur pass for the whole background — much cheaper than blur per orb */
  filter: blur(70px);
  /* Promote to GPU layer once */
  will-change: transform;
  transform: translateZ(0);
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  will-change: transform, opacity;
  /* No mix-blend-mode — colours blend naturally through opacity overlap */
}

.orb1 {
  width: 90vw; height: 90vw;
  background: radial-gradient(circle, #6a0dad 0%, transparent 70%);
  top: -20%; left: -20%; opacity: 0.9;
  animation: o1 24s ease-in-out infinite;
}
.orb2 {
  width: 80vw; height: 80vw;
  background: radial-gradient(circle, #EF59D4 0%, transparent 65%);
  top: 10%; right: -30%; opacity: 0.7;
  animation: o2 30s ease-in-out infinite;
}
.orb3 {
  width: 70vw; height: 70vw;
  background: radial-gradient(circle, #F61905 0%, transparent 65%);
  bottom: -20%; left: 10%; opacity: 0.55;
  animation: o3 22s ease-in-out infinite;
}
.orb4 {
  width: 60vw; height: 60vw;
  background: radial-gradient(circle, #FFA70A 0%, transparent 65%);
  bottom: 0%; right: -10%; opacity: 0.5;
  animation: o4 27s ease-in-out infinite;
}
.orb5 {
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, #260970 0%, transparent 70%);
  top: 30%; left: 30%; opacity: 0.8;
  animation: o5 34s ease-in-out infinite;
}
.orb6 {
  width: 55vw; height: 55vw;
  background: radial-gradient(circle, #00FFFF 0%, transparent 65%);
  bottom: 20%; left: -15%; opacity: 0.22;
  animation: o6 29s ease-in-out infinite;
}

/* Transform-only animations — GPU-composited, zero paint cost */
@keyframes o1 {
  0%,100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(8vw,5vh) scale(1.1); }
  66%      { transform: translate(-5vw,10vh) scale(0.95); }
}
@keyframes o2 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%      { transform: translate(-10vw,8vh) scale(1.15); }
  70%      { transform: translate(5vw,-5vh) scale(0.9); }
}
@keyframes o3 {
  0%,100% { transform: translate(0,0) scale(1); }
  50%      { transform: translate(12vw,-8vh) scale(1.2); }
}
@keyframes o4 {
  0%,100% { transform: translate(0,0) scale(1); }
  35%      { transform: translate(-8vw,-6vh) scale(1.1); }
  70%      { transform: translate(6vw,4vh) scale(0.92); }
}
@keyframes o5 {
  0%,100% { transform: translate(0,0) scale(1); opacity: 0.8; }
  50%      { transform: translate(-6vw,-8vh) scale(1.3); opacity: 0.5; }
}
@keyframes o6 {
  0%,100% { transform: translate(0,0) scale(1); }
  40%      { transform: translate(10vw,-6vh) scale(1.2); }
  75%      { transform: translate(-4vw,8vh) scale(0.85); }
}

/* =====================
   GRAIN — subtle texture, pointer-events off, no animation
===================== */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9998;
  opacity: 0.45;
}

/* =====================
   LOGO — no drop-shadow (causes repaint every frame with canvas)
===================== */
.logo-wrap {
  position: relative;
  z-index: 20;
  /* Promote to own layer so canvas redraws don't trigger parent repaints */
  transform: translateZ(0);
  will-change: contents;
}
#logo-canvas { display: block; }

/* =====================
   FADE-IN
===================== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =====================
   TOP RIGHT
===================== */
.top-right {
  position: absolute;
  top: 5vh; right: 4.5vw;
  z-index: 20;
  text-align: right;
  line-height: 1.4;
  opacity: 0;
  animation: fadeUp 1.2s ease forwards 1s;
  font-weight: 300;
}
.top-right .brand {
  font-size: clamp(0.6rem, 1vw, 0.75rem);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  display: block;
  margin-bottom: 0;
}
.top-right a {
  font-size: clamp(0.7rem, 1.2vw, 0.85rem);
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  padding-bottom: 1px;
  transition: border-color 0.3s;
}
.top-right a:hover { border-color: rgba(255,255,255,0.9); }

/* =====================
   BOTTOM LEFT
===================== */
.bottom-left {
  position: absolute;
  bottom: 5.5vh; left: 4.5vw;
  z-index: 20;
  color: rgba(255,255,255,0.85);
  line-height: 2;
  opacity: 0;
  animation: fadeUp 1.2s ease forwards 1s;
  font-weight: 300;
}
.bottom-left p {
  font-size: clamp(0.7rem, 1.2vw, 0.85rem);
  letter-spacing: 0.05em;
}

/* =====================
   SCROLL INDICATOR — hidden
===================== */
.scroll-ind { display: none; }

/* =====================
   MOBILE
===================== */
@media (max-width: 600px) {
  .top-right   { top: 4vh; right: 5vw; }
  .bottom-left {
    bottom: calc(12vh + env(safe-area-inset-bottom, 0px));
    left: 5vw;
  }
  .bg { filter: blur(50px); }
}
</style>
</head>
<body>

<div id="cursor"></div>

<section id="hero">

  <div class="bg">
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="bg-orb orb4"></div>
    <div class="bg-orb orb5"></div>
    <div class="bg-orb orb6"></div>
  </div>

  <div class="logo-wrap">
    <canvas id="logo-canvas"></canvas>
  </div>

  <div class="top-right">
    <span class="brand">optic/haptic</span>
    <a href="mailto:what@o-h.now">what@o-h.now</a>
  </div>

  <div class="bottom-left">
    <p>worlds you can touch</p>
    <p>london, uk</p>
  </div>

  <div class="scroll-ind"></div>

</section>

<script>
// CURSOR
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});
document.querySelectorAll('a').forEach(el => {
  el.addEventListener('mouseenter', () => cur.classList.add('big'));
  el.addEventListener('mouseleave', () => cur.classList.remove('big'));
});

// =============================================
// LOGO CANVAS ANIMATION
// Performance optimisations:
//  - rAF loop pauses during the static hold and gap phases
//  - offscreen canvases pre-rendered once, never re-drawn
//  - DPR-aware for crisp retina rendering
//  - clearRect only touches dirty region, not full canvas
// =============================================
(function () {
  const canvas = document.getElementById('logo-canvas');
  const ctx    = canvas.getContext('2d', { alpha: true });

  const DPR   = window.devicePixelRatio || 1;
  const BASE  = 113.39;
  const SCALE = window.innerWidth < 600 ? 2.2 : window.innerWidth < 1200 ? 3.2 : 4.0;
  const W = BASE * SCALE;   // logical width
  const H = BASE * SCALE;   // logical height

  canvas.width        = Math.round(W * DPR);
  canvas.height       = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);

  function makeOff() {
    const c = document.createElement('canvas');
    c.width  = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    const x  = c.getContext('2d', { alpha: true });
    x.scale(DPR, DPR);
    return { c, x };
  }

  const { c: offOH,    x: ctxOH    } = makeOff();
  const { c: offSlash, x: ctxSlash } = makeOff();

  const pathO = new Path2D('M27.98,70.66c-3.18,0-5.98-.56-8.38-1.69-2.4-1.13-4.28-2.7-5.63-4.73-1.35-2.03-2.03-4.38-2.03-7.05s.67-5.07,2.03-7.09c1.35-2.03,3.23-3.6,5.63-4.73,2.4-1.13,5.19-1.69,8.38-1.69s5.97.56,8.38,1.69c2.4,1.13,4.27,2.7,5.61,4.73,1.34,2.03,2,4.39,2,7.09s-.67,5.02-2,7.05c-1.34,2.03-3.2,3.6-5.61,4.73-2.4,1.13-5.19,1.69-8.38,1.69ZM27.98,64.94c1.74,0,3.23-.32,4.48-.95,1.25-.63,2.21-1.52,2.88-2.68.68-1.16,1.01-2.53,1.01-4.12s-.34-3.01-1.01-4.17c-.67-1.16-1.64-2.05-2.88-2.68-1.25-.63-2.74-.95-4.48-.95s-3.2.32-4.46.95c-1.26.63-2.23,1.52-2.91,2.68-.67,1.16-1.01,2.54-1.01,4.17s.34,2.97,1.01,4.12c.68,1.16,1.64,2.05,2.91,2.68,1.26.63,2.75.95,4.46.95Z');
  const pathH = new Path2D('M74.63,48.94c-.9-1.8-2.21-3.19-3.92-4.17-1.71-.97-3.78-1.46-6.21-1.46-2.1,0-4.02.5-5.76,1.49-1.6.91-2.93,2.21-4.01,3.85v-13.71h-7.52v34.68h7.52v-12.38c0-1.59.29-2.96.88-4.1.59-1.14,1.43-2.03,2.52-2.68,1.1-.64,2.38-.97,3.85-.97,2.1,0,3.71.59,4.82,1.78,1.11,1.19,1.67,2.93,1.67,5.25v13.1h7.52v-14.23c0-2.49-.45-4.64-1.35-6.44Z');
  const pathSlash = new Path2D('M94.08,33.4h7.36l-12.61,36.21h-7.36l12.61-36.21Z');

  ctxOH.save();
  ctxOH.scale(SCALE, SCALE);
  ctxOH.fillStyle = '#ffffff';
  ctxOH.fill(pathO);
  ctxOH.fill(pathH);
  ctxOH.restore();

  ctxSlash.save();
  ctxSlash.scale(SCALE, SCALE);
  ctxSlash.fillStyle = '#ffffff';
  ctxSlash.fill(pathSlash);
  ctxSlash.restore();

  const SLASH_LEFT_PX = 79.47 * SCALE;
  const FAR_LEFT      = -SLASH_LEFT_PX;

  const TOTAL = 5000;
  const T1 = 0.20, T2 = 0.58, T3 = 0.78;

  function ease(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2;
  }

  let start   = null;
  let rafId   = null;
  let holding = false;  // true during static hold — rAF paused

  function drawFrame(slashX, ohClip) {
    ctx.clearRect(0, 0, W, H);

    if (ohClip > 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, ohClip, H);
      ctx.clip();
      ctx.drawImage(offOH, 0, 0, W, H);
      ctx.restore();
    }

    ctx.save();
    ctx.translate(slashX, 0);
    ctx.drawImage(offSlash, 0, 0, W, H);
    ctx.restore();
  }

  function render(now) {
    if (!start) start = now;
    const elapsed = (now - start) % TOTAL;
    const p = elapsed / TOTAL;

    let slashX, ohClip;

    if (p < T1) {
      // Sweeping in — animate every frame
      holding = false;
      const t = ease(p / T1);
      slashX  = FAR_LEFT * (1 - t);
      ohClip  = Math.max(0, SLASH_LEFT_PX + slashX);
      drawFrame(slashX, ohClip);
      rafId = requestAnimationFrame(render);

    } else if (p < T2) {
      // Holding full logo — draw once, pause rAF
      if (!holding) {
        holding = true;
        drawFrame(0, W);
        // Resume rAF just before the sweep-out phase begins
        const msUntilT2 = (T2 * TOTAL) - elapsed;
        // Wake up 1 frame (~16ms) before T2 so we don't miss the transition
        setTimeout(() => {
          holding = false;
          rafId = requestAnimationFrame(render);
        }, Math.max(0, msUntilT2 - 16));
      }

    } else if (p < T3) {
      // Sweeping out — animate every frame
      holding = false;
      const t = ease((p - T2) / (T3 - T2));
      slashX  = FAR_LEFT * t;
      ohClip  = Math.max(0, SLASH_LEFT_PX + slashX);
      drawFrame(slashX, ohClip);
      rafId = requestAnimationFrame(render);

    } else {
      // Gap — slash at rest, draw once, pause rAF
      if (!holding) {
        holding = true;
        drawFrame(FAR_LEFT, 0);
        const msUntilNext = (TOTAL - elapsed);
        setTimeout(() => {
          holding = false;
          start = null; // reset so next cycle starts fresh
          rafId = requestAnimationFrame(render);
        }, Math.max(0, msUntilNext - 16));
      }
    }
  }

  rafId = requestAnimationFrame(render);

  // Pause animation when tab is hidden — saves battery/CPU on mobile
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      holding = false;
      start   = null;
      rafId   = requestAnimationFrame(render);
    }
  });
})();
</script>
</body>
</html>
